spring:
  application:
    name: impeldown
  datasource:
    url: jdbc:postgresql://localhost:5432/impeldown
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://idp.example.com/issuer
